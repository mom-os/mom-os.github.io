<!DOCTYPE html><html><body style="margin:0;padding:0;background:#f3f1ee;font-family:Georgia,serif;color:#2c2a28;">
<div style="max-width:480px;margin:32px auto;padding:32px 28px;background:#fbfaf8;border:1px solid #e4e0da;border-radius:10px;">
<p style="margin:0 0 8px;font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#6e6964;">Mom.OS</p>
<h1 style="margin:0 0 16px;font-weight:500;font-size:28px;">Confirm your email</h1>
<p style="margin:0 0 20px;font-family:system-ui,sans-serif;font-size:15px;line-height:1.5;color:#6e6964;">Enter this code in Mom.OS to finish creating your account:</p>
<p style="margin:0 0 24px;text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:36px;font-weight:700;letter-spacing:.28em;">{{ .Token }}</p>
<p style="margin:0 0 12px;font-family:system-ui,sans-serif;font-size:14px;line-height:1.5;color:#6e6964;">Or confirm with this link on a computer:</p>
<p style="margin:0 0 24px;font-family:system-ui,sans-serif;font-size:14px;"><a href="{{ .ConfirmationURL }}" style="color:#3d6b6e;">Confirm email for Mom.OS</a></p>
<p style="margin:0;font-family:system-ui,sans-serif;font-size:12px;color:#a8a29c;">If you didn’t create a Mom.OS account, you can ignore this email.</p>
</div></body></html>
